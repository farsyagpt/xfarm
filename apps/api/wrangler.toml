name = "xfarming-api"
main = "src/index.ts"
compatibility_date = "2026-05-19"

[vars]
# Dev: override with actual Pages URL in production via Cloudflare dashboard
APP_ORIGIN = "https://xfarming-web.pages.dev"

# ── Secrets (set via `wrangler secret put <NAME>` or Cloudflare dashboard) ──
# JWT_SECRET          — random 32+ char string
# ADMIN_SECRET        — random 32+ char string for /api/admin/* endpoints
# R2_ACCOUNT_ID       — Cloudflare account ID
# R2_ACCESS_KEY_ID    — R2 API token access key
# R2_SECRET_ACCESS_KEY — R2 API token secret
# R2_BUCKET_NAME      — e.g. "xfarming"
# HF_STUDIO_BASE_URL  — e.g. "https://farsyagpt-xfarm.hf.space"
# HF_XFARM_BASE_URL   — same Space or separate; e.g. "https://farsyagpt-xfarm.hf.space"

[[d1_databases]]
binding = "DB"
database_name = "xfarming"
# Run: wrangler d1 create xfarming  → paste the returned database_id below
database_id = "b4928b74-b60a-4369-8aca-5dc318e294a4"
migrations_dir = "../../infra/d1/migrations"

[[queues.producers]]
binding = "JOBS"
queue = "xfarming-jobs"

[[queues.consumers]]
queue = "xfarming-jobs"
max_batch_size = 5
max_batch_timeout = 30
