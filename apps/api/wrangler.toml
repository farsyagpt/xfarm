name = "xfarming-api"
main = "src/index.ts"
compatibility_date = "2026-05-19"

[vars]
# Dev: override with actual Pages URL in production via Cloudflare dashboard
APP_ORIGIN = "https://xfarming.pages.dev"

# ── Secrets (set via `wrangler secret put <NAME>` or Cloudflare dashboard) ──
# JWT_SECRET              — random 32+ char string
# ADMIN_SECRET            — random 32+ char string for /api/admin/* endpoints
#
# Supabase Storage (S3-compatible, free tier 1GB)
# SUPABASE_URL            — e.g. https://xxxx.supabase.co
# SUPABASE_S3_ACCESS_KEY  — Supabase dashboard → Storage → S3 Access Keys
# SUPABASE_S3_SECRET_KEY  — same
# SUPABASE_BUCKET         — bucket name, e.g. "xfarming"
#
# HF Spaces
# HF_STUDIO_BASE_URL      — e.g. https://farsyagpt-xfarm.hf.space
# HF_XFARM_BASE_URL       — same or separate Space URL

[[d1_databases]]
binding = "DB"
database_name = "xfarming"
database_id = "b4928b74-b60a-4369-8aca-5dc318e294a4"

[[queues.producers]]
binding = "JOBS"
queue = "xfarming-jobs"

[[queues.consumers]]
queue = "xfarming-jobs"
max_batch_size = 5
max_batch_timeout = 30
